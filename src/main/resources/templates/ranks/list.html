<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Manage Ranks</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
    <script src="https://unpkg.com/htmx.org@1.9.6"
        integrity="sha384-FhXw7b6AlE/jyjlZH5iHa/tTe9EpJ1Y55RjcgPbjeWMskSxZt1v9qkxLJWNJaGni"
        crossorigin="anonymous"></script>

    <meta name="csrf-token" th:if="${_csrf != null}" th:content="${_csrf.token}" />
    <meta name="csrf-header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
    <script src="/js/csrf-config.js"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header th:replace="~{layout/header :: header}"></header>

    <!-- Main Content -->
    <main class="container mx-auto p-8">
        <div class="bg-white shadow-lg rounded-lg p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Manage Ranks</h1>
                <a th:href="@{/ranks/new}" class="bg-blue-600 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-700 transition duration-300">
                    Add New Rank
                </a>
            </div>

            <!-- Success/Error Messages -->
            <div th:if="${success}" class="mb-4 p-4 bg-green-100 text-green-700 rounded-lg">
                <p th:text="${success}"></p>
            </div>
            <div th:if="${error}" class="mb-4 p-4 bg-red-100 text-red-700 rounded-lg">
                <p th:text="${error}"></p>
            </div>

            <!-- Ranks Table -->
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-3 px-4 text-left text-sm font-medium text-gray-600 uppercase tracking-wider">Order</th>
                            <th class="py-3 px-4 text-left text-sm font-medium text-gray-600 uppercase tracking-wider">Belt</th>
                            <th class="py-3 px-4 text-left text-sm font-medium text-gray-600 uppercase tracking-wider">Name</th>
                            <th class="py-3 px-4 text-left text-sm font-medium text-gray-600 uppercase tracking-wider">Max Stripes</th>
                            <th class="py-3 px-4 text-left text-sm font-medium text-gray-600 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr th:each="rank : ${ranks}">
                            <td class="py-3 px-4 text-sm text-gray-800" th:text="${rank.displayOrder}"></td>
                            <td class="py-3 px-4 text-sm text-gray-800">
                                <div class="w-32 h-8 rounded-md shadow-sm flex items-center justify-center" 
                                     th:style="'background-color: ' + ${rank.beltColor}">
                                    <span th:text="${rank.name}" 
                                          th:style="'color: ' + (${#strings.substring(rank.beltColor, 1)} > '888888' ? '#000000' : '#ffffff') + '; font-weight: bold;'"></span>
                                </div>
                            </td>
                            <td class="py-3 px-4 text-sm text-gray-800" th:text="${rank.name}"></td>
                            <td class="py-3 px-4 text-sm text-gray-800">
                                <div class="flex items-center">
                                    <span th:text="${rank.maxStripes}"></span>
                                    <div class="ml-2 flex" th:if="${rank.maxStripes > 0}">
                                        <div th:each="i : ${#numbers.sequence(1, rank.maxStripes)}" 
                                             class="w-1 h-4 bg-white border border-gray-300 mx-0.5"></div>
                                    </div>
                                    <span th:if="${rank.maxStripes == 0}" class="text-gray-500 ml-2">(No stripes)</span>
                                </div>
                            </td>
                            <td class="py-3 px-4 text-sm text-gray-800">
                                <div class="flex space-x-2">
                                    <a th:href="@{/ranks/edit/{id}(id=${rank.id})}"
                                        class="text-blue-600 hover:text-blue-800 transition duration-300">
                                        Edit
                                    </a>
                                    <a th:href="@{/ranks/delete/{id}(id=${rank.id})}"
                                        class="text-red-600 hover:text-red-800 transition duration-300"
                                        onclick="return confirm('Are you sure you want to delete this rank?')">
                                        Delete
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${ranks.empty}">
                            <td colspan="5" class="py-6 px-4 text-center text-gray-500">
                                No ranks found. Create your first rank to get started.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
