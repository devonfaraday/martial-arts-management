<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${rank.id == null} ? 'Create Rank' : 'Edit Rank'">Edit Rank</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
    <script src="https://unpkg.com/htmx.org@1.9.6"
        integrity="sha384-FhXw7b6AlE/jyjlZH5iHa/tTe9EpJ1Y55RjcgPbjeWMskSxZt1v9qkxLJWNJaGni"
        crossorigin="anonymous"></script>

    <meta name="csrf-token" th:if="${_csrf != null}" th:content="${_csrf.token}" />
    <meta name="csrf-header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
    <script src="/js/csrf-config.js"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header th:replace="~{layout/header :: header}"></header>

    <!-- Main Content -->
    <main class="container mx-auto p-8">
        <div class="bg-white shadow-lg rounded-lg p-6 max-w-2xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-6" th:text="${rank.id == null} ? 'Create New Rank' : 'Edit Rank'">Edit Rank</h1>

            <form th:action="${rank.id == null} ? @{/ranks/save} : @{/ranks/update/{id}(id=${rank.id})}" th:object="${rank}" method="post" class="space-y-6">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <!-- Rank Information -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="col-span-2">
                        <label for="name" class="block text-sm font-medium text-gray-700">Rank Name</label>
                        <input type="text" id="name" th:field="*{name}" required
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2" />
                        <p class="mt-1 text-sm text-gray-500">Example: White Belt, Yellow Belt, etc.</p>
                    </div>
                    
                    <div>
                        <label for="beltColor" class="block text-sm font-medium text-gray-700">Belt Color</label>
                        <div class="mt-1 flex items-center">
                            <input type="color" id="beltColorPicker" 
                                th:value="${rank.beltColor != null ? rank.beltColor : '#ffffff'}"
                                class="h-12 w-12 rounded border border-gray-300 mr-2" />
                            <input type="hidden" id="beltColor" th:field="*{beltColor}" />
                        </div>
                        <p class="mt-1 text-sm text-gray-500">Select a color for this belt rank</p>
                    </div>
                    
                    <div>
                        <label for="maxStripes" class="block text-sm font-medium text-gray-700">Maximum Stripes</label>
                        <input type="number" id="maxStripes" th:field="*{maxStripes}" min="0" max="10"
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2" />
                        <p class="mt-1 text-sm text-gray-500">Number of stripes this rank can have (0-10)</p>
                    </div>
                    
                    <div>
                        <label for="displayOrder" class="block text-sm font-medium text-gray-700">Display Order</label>
                        <input type="number" id="displayOrder" th:field="*{displayOrder}" min="1"
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2" />
                        <p class="mt-1 text-sm text-gray-500">Order in which ranks are displayed (lowest first)</p>
                    </div>
                </div>
                
                <!-- Belt Preview -->
                <div class="mt-6 border-t pt-4">
                    <h3 class="text-lg font-medium text-gray-900 mb-2">Belt Preview</h3>
                    <div class="flex flex-col items-center">
                        <div id="beltPreview" class="w-full h-16 rounded-md shadow-md flex items-center justify-center mb-4">
                            <!-- Belt will be rendered here -->
                        </div>
                        <div id="stripePreview" class="flex mt-2">
                            <!-- Stripes will be rendered here -->
                        </div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex justify-between pt-4 border-t">
                    <a th:href="@{/ranks}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg shadow hover:bg-gray-300 transition duration-300">
                        Cancel
                    </a>
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg shadow hover:bg-blue-700 transition duration-300">
                        Save Rank
                    </button>
                </div>
            </form>
        </div>
    </main>
    <!-- JavaScript for Belt Preview -->
    <script src="/js/rank-editor.js"></script>
</body>

</html>
