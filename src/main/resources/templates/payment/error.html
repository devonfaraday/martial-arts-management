<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4 md:p-8">
        <div class="flex justify-center">
            <div class="w-full max-w-xl bg-white shadow-lg rounded-lg p-6">
                <div class="text-center">
                    <div class="mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-yellow-500 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </div>
                    
                    <h2 class="text-2xl font-bold text-gray-800 mb-4" th:text="${errorMessage != null ? errorMessage : 'Payment Processing Issue'}">Payment Processing Issue</h2>
                    
                    <div class="mb-6 text-gray-600">
                        <p class="mb-2" th:text="${errorDetails != null ? errorDetails : 'There was an issue processing your payment. However, your payment may have been completed successfully.'}">There was an issue processing your payment. However, your payment may have been completed successfully.</p>
                        
                        <div th:if="${sessionId != null}" class="mt-4 p-4 bg-gray-50 rounded-lg text-sm text-left">
                            <p class="font-semibold">Technical Details:</p>
                            <p>Session ID: <span class="font-mono" th:text="${sessionId}">session_id</span></p>
                            <p class="mt-2">Please provide this information if you contact support.</p>
                        </div>
                    </div>
                    
                    <div class="mt-6 flex flex-col sm:flex-row justify-center gap-3">
                        <a href="/students" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Return to Students</a>
                        <a href="/" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition-colors">Go to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
