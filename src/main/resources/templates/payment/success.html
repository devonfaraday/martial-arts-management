<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4 md:p-8">
        <div class="flex justify-center">
            <div class="w-full max-w-xl bg-white shadow-lg rounded-lg p-6">
                <div class="text-center">
                    <div class="mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-green-500 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                    
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Payment Successful!</h2>
                    
                    <div class="mb-6 text-gray-600">
                        <p class="mb-2">Your payment has been processed successfully.</p>
                        
                        <div th:if="${description != null}" class="mt-2">
                            <p>Payment for: <span class="font-medium" th:text="${description}">Subscription</span></p>
                        </div>
                        
                        <div th:if="${amount != null}" class="mt-2">
                            <p>Amount: <span class="font-medium" th:text="'$' + ${amount}">$0.00</span></p>
                        </div>
                        
                        <div th:if="${paymentId != null}" class="mt-4 p-4 bg-gray-50 rounded-lg text-sm text-left">
                            <p class="font-semibold">Payment Details:</p>
                            <p>Payment ID: <span class="font-mono" th:text="${paymentId}">payment_id</span></p>
                        </div>
                    </div>
                    
                    <div class="mt-6 flex flex-col sm:flex-row justify-center gap-3">
                        <a href="/students" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Return to Students</a>
                        <a href="/" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition-colors">Go to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
