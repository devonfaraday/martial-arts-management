<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Rank Modal Fragment -->
    <div th:fragment="rankModalContent" class="mt-3">
        <h3 class="text-lg font-medium text-gray-900 mb-4">Update Student Rank</h3>
        
        <form th:action="@{/students/{id}/promote(id=${student.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            
            <div class="mb-4">
                <label for="rankId" class="block text-sm font-medium text-gray-700 mb-1">Belt Rank</label>
                <select id="rankId" name="rankId" required 
                        class="w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2"
                        th:hx-get="@{/students/{id}/stripe-preview(id=${student.id})}"
                        th:hx-trigger="'change'"
                        th:hx-target="'#stripePreview'"
                        th:hx-include="'#stripes'"
                        th:hx-swap="'innerHTML'">
                    <option value="">Select a rank</option>
                    <option th:each="rank : ${@rankService.getAllRanks()}" 
                            th:value="${rank.id}" 
                            th:selected="${student.rank != null && student.rank.id == rank.id}"
                            th:text="${rank.name}"
                            th:attr="data-max-stripes=${rank.maxStripes},
                                    data-color=${rank.beltColor}">
                    </option>
                </select>
            </div>
            
            <div class="mb-4">
                <label for="stripes" class="block text-sm font-medium text-gray-700 mb-1">Stripes</label>
                <div class="flex items-center">
                    <input type="number" id="stripes" name="stripes" min="0" max="10" 
                           th:value="${student.currentStripes != null ? student.currentStripes : 0}"
                           class="w-20 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2"
                           th:hx-get="@{/students/{id}/stripe-preview(id=${student.id})}"
                           th:hx-trigger="'input'"
                           th:hx-target="'#stripePreview'"
                           th:hx-include="'#rankId'"
                           th:hx-swap="'innerHTML'" />
                    <div class="ml-4 flex-grow">
                        <div id="stripePreview" class="flex">
                            <!-- Stripe preview will be loaded here -->
                            <th:block th:replace="students/fragments/stripe_preview :: stripePreview" />
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-between mt-6">
                <button type="button" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg shadow hover:bg-gray-300 transition duration-300"
                        onclick="document.getElementById('rankModal').classList.add('hidden')">
                    Cancel
                </button>
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg shadow hover:bg-blue-700 transition duration-300">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</body>
</html>
