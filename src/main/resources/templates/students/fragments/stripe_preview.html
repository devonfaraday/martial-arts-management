<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Stripe Preview Fragment -->
    <div th:fragment="stripePreview" class="flex">
        <!-- Show stripes based on the current number and max allowed for the rank -->
        <div th:each="i : ${#numbers.sequence(1, currentStripes != null ? currentStripes : 0)}" 
             class="w-1.5 h-6 bg-white border border-gray-300 mx-0.5">
        </div>
    </div>
</body>
</html>
